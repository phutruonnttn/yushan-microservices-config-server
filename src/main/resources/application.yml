server:
  port: 8888

spring:
  application:
    name: config-server
  
  cloud:
    config:
      server:
        # Git Backend - Read configs from GitHub repository
        git:
          uri: ${CONFIG_REPO_URI:https://github.com/phutruonnttn/yushan-microservices-config-data.git}
          search-paths: configs
          default-label: main
          # Refresh rate: fetch new configs every 300 seconds
          refresh-rate: 300
          # Clone on startup (ensures latest configs are available)
          clone-on-start: true
          # Force pull on refresh
          force-pull: true

# Eureka Configuration
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://yushan-eureka-registry:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,env,refresh
  endpoint:
    health:
      show-details: always

# Logging
logging:
  level:
    org.springframework.cloud.config: DEBUG
    org.springframework.cloud.config.server: DEBUG
    com.yushan.config: DEBUG